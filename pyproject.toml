[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hippocampus-mcp"
version = "0.2.0"
description = "Decision memory for AI coding agents, as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "z10 labs" }]
keywords = ["mcp", "ai-agents", "decision-records", "adr", "llm", "codebase-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp>=1.0.0",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/z10-labs/hippocampus"
Repository = "https://github.com/z10-labs/hippocampus"
Issues = "https://github.com/z10-labs/hippocampus/issues"

[project.scripts]
hippocampus-mcp = "hippocampus.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
